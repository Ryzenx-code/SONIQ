<!DOCTYPE html>

<html lang="en">
<head>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

      width: 100%;
      height: 100%;

<defs>
<lineargradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#0066ff"></stop>
<stop offset="50%" stop-color="#673ab7"></stop>
<stop offset="100%" stop-color="#ec4899"></stop>
</lineargradient>
<lineargradient id="cyanAccent" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" stop-color="#00d2ff"></stop>
<stop offset="100%" stop-color="#0066ff"></stop>

<filter height="140%" id="neonGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="6"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<style>
    @keyframes pulseRing {
      0% { r: 120px; opacity: 0.15; stroke-width: 2px; }
      50% { r: 145px; opacity: 0.4; stroke-width: 4px; }
      100% { r: 120px; opacity: 0.15; stroke-width: 2px; }
    }
    @keyframes rotateRibbon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes waveBar {
      0%, 100% { height: 18px; transform: translateY(0); }
      50% { height: 48px; transform: translateY(-15px); }
    }
    @keyframes breatheGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(0,102,255,0.4)); }
      50% { filter: drop-shadow(0 0 24px rgba(236,72,153,0.7)); }
    }
    .pulsing-ring {
      animation: pulseRing 3.5s ease-in-out infinite;
      transform-origin: 200px 200px;
    }
    .rotating-outer {
      animation: rotateRibbon 14s linear infinite;
      transform-origin: 200px 200px;
    }
    .wave-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
    .wave-2 { animation: waveBar 1.2s ease-in-out infinite 0.3s; }
    .wave-3 { animation: waveBar 1.2s ease-in-out infinite 0.5s; }
    .wave-4 { animation: waveBar 1.2s ease-in-out infinite 0.2s; }
    .wave-5 { animation: waveBar 1.2s ease-in-out infinite 0.4s; }
    .center-mark { animation: breatheGlow 3s ease-in-out infinite; }
  </style>
<!-- Background Soft Aura -->
<circle cx="200" cy="200" fill="url(#primaryGrad)" opacity="0.08" r="150"></circle>
<!-- Harmonic Orbit Rings -->
<circle class="pulsing-ring" cx="200" cy="200" fill="none" r="130" stroke="url(#primaryGrad)" stroke-dasharray="8 6"></circle>
<g class="rotating-outer" opacity="0.6">
<circle cx="200" cy="200" fill="none" r="115" stroke="url(#cyanAccent)" stroke-dasharray="35 70 20 40" stroke-linecap="round" stroke-width="2.5"></circle>

<g opacity="0.85">

<rect class="wave-1" fill="#0066ff" height="18" rx="2.5" width="5" x="50" y="191"></rect>

<rect class="wave-4" fill="#9333ea" height="18" rx="2.5" width="5" x="95" y="191"></rect>
<!-- Right Equalizer Ribbons -->
<rect class="wave-4" fill="#9333ea" height="18" rx="2.5" width="5" x="300" y="191"></rect>
<rect class="wave-3" fill="#c026d3" height="18" rx="2.5" width="5" x="315" y="191"></rect>
<rect class="wave-2" fill="#db2777" height="18" rx="2.5" width="5" x="330" y="191"></rect>
<rect class="wave-1" fill="#ec4899" height="18" rx="2.5" width="5" x="345" y="191"></rect>
</g>

<g class="center-mark">

</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_69 -->
</body>
</html>
